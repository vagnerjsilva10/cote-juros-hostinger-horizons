name: Reactivation - Import Queued Leads

on:
  schedule:
    # Keeps manually added queued rows moving without creating new queue rows.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: reactivation-import-queued
  cancel-in-progress: false

jobs:
  import-queued:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      COTE_API_BASE_URL: ${{ vars.COTE_API_BASE_URL || 'https://api.cotejuros.com.br' }}
      COTE_API_TOKEN: ${{ secrets.COTE_API_TOKEN }}
      GOOGLE_SHEETS_REACTIVATION_ID: ${{ vars.GOOGLE_SHEETS_REACTIVATION_ID || '16rV2fuSxVCSkmJYOijmNZF5sP1sQIR9ct9r97Ti-vvY' }}
      GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
      REACTIVATION_BASE_URL: ${{ vars.REACTIVATION_BASE_URL || 'https://www.cotejuros.com.br' }}
      REACTIVATION_BATCH_ID: ${{ vars.REACTIVATION_BATCH_ID || 'piloto-5-2026-04-17' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm run prisma:generate --prefix apps/api

      - name: Import queued leads
        run: npm run import:reactivation --prefix apps/api
