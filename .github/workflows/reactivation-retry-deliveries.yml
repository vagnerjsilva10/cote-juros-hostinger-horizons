name: Reactivation - Retry Deliveries

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: reactivation-retry-deliveries
  cancel-in-progress: false

jobs:
  retry-deliveries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: production
      COTE_API_BASE_URL: ${{ vars.COTE_API_BASE_URL || 'https://api.cotejuros.com.br' }}
      COTE_API_TOKEN: ${{ secrets.COTE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm run prisma:generate --prefix apps/api

      - name: Retry due deliveries
        run: npm run retry:reactivation --prefix apps/api
