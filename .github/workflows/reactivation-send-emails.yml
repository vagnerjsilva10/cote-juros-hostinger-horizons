name: Reactivation - Send Emails

on:
  schedule:
    # 09:30-17:30 BRT, Monday-Friday. GitHub cron runs in UTC.
    - cron: '30 12-20 * * 1-5'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Maximum emails to send in this run'
        required: true
        default: '5'
      daily_limit:
        description: 'Daily send cap enforced by the email job'
        required: true
        default: '5'
      dry_run:
        description: 'Run without sending through SendGrid'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: reactivation-send-emails
  cancel-in-progress: false

jobs:
  send-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      COTE_API_BASE_URL: ${{ vars.COTE_API_BASE_URL || 'https://api.cotejuros.com.br' }}
      COTE_API_TOKEN: ${{ secrets.COTE_API_TOKEN }}
      GOOGLE_SHEETS_REACTIVATION_ID: ${{ vars.GOOGLE_SHEETS_REACTIVATION_ID || '16rV2fuSxVCSkmJYOijmNZF5sP1sQIR9ct9r97Ti-vvY' }}
      GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
      REACTIVATION_BASE_URL: ${{ vars.REACTIVATION_BASE_URL || 'https://www.cotejuros.com.br' }}
      REACTIVATION_EMAIL_ENABLED: 'true'
      REACTIVATION_EMAIL_DRY_RUN: ${{ github.event.inputs.dry_run || vars.REACTIVATION_EMAIL_DRY_RUN || 'false' }}
      REACTIVATION_EMAIL_BATCH_SIZE: ${{ github.event.inputs.batch_size || vars.REACTIVATION_EMAIL_BATCH_SIZE || '5' }}
      REACTIVATION_EMAIL_DAILY_LIMIT: ${{ github.event.inputs.daily_limit || vars.REACTIVATION_EMAIL_DAILY_LIMIT || '5' }}
      REACTIVATION_EMAIL_SEND_DRY_RUN_ROWS: ${{ vars.REACTIVATION_EMAIL_SEND_DRY_RUN_ROWS || 'false' }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      SENDGRID_FROM_EMAIL: ${{ vars.SENDGRID_FROM_EMAIL || 'noreply@em.cotejuros.com.br' }}
      SENDGRID_FROM_NAME: ${{ vars.SENDGRID_FROM_NAME || 'Cote Juros' }}
      SENDGRID_REPLY_TO: ${{ vars.SENDGRID_REPLY_TO || 'noreply@em.cotejuros.com.br' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm run prisma:generate --prefix apps/api

      - name: Send reactivation emails
        run: npm run send:reactivation:emails --prefix apps/api
