name: Reactivation - Prepare and Import

on:
  schedule:
    # 09:00 BRT, Monday-Friday. GitHub cron runs in UTC.
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      prepare:
        description: 'Prepare new leads from IMPORT_AUTOMACAO before importing'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      limit:
        description: 'Maximum new leads to add to leads_queue'
        required: true
        default: '5'

concurrency:
  group: reactivation-prepare-import
  cancel-in-progress: false

jobs:
  prepare-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      COTE_API_BASE_URL: ${{ vars.COTE_API_BASE_URL || 'https://api.cotejuros.com.br' }}
      COTE_API_TOKEN: ${{ secrets.COTE_API_TOKEN }}
      GOOGLE_SHEETS_REACTIVATION_ID: ${{ vars.GOOGLE_SHEETS_REACTIVATION_ID || '16rV2fuSxVCSkmJYOijmNZF5sP1sQIR9ct9r97Ti-vvY' }}
      GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
      REACTIVATION_BASE_URL: ${{ vars.REACTIVATION_BASE_URL || 'https://www.cotejuros.com.br' }}
      REACTIVATION_BATCH_ID: ${{ vars.REACTIVATION_BATCH_ID || 'piloto-5-2026-04-17' }}
      REACTIVATION_QUEUE_LIMIT: ${{ github.event.inputs.limit || vars.REACTIVATION_QUEUE_LIMIT || '5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm run prisma:generate --prefix apps/api

      - name: Prepare queue
        if: ${{ github.event_name == 'schedule' || github.event.inputs.prepare == 'true' }}
        run: npm run prepare:reactivation:queue --prefix apps/api -- "$REACTIVATION_QUEUE_LIMIT"

      - name: Import queued leads
        run: npm run import:reactivation --prefix apps/api
